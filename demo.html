<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenALTCHA Demo</title>
    <script type="module" src="https://cdn.jsdelivr.net/npm/altcha/dist/altcha.min.js"></script>
    <style>
        :root {
            --bg-color: #f0f2f5;
            --panel-bg: #ffffff;
            --text-main: #333333;
            --text-muted: #666666;
            --border-color: #dddddd;
            --primary: #2563eb;
            --primary-hover: #1d4ed8;
            --success: #10b981;
            --warning: #f59e0b;
            --secondary: #64748b;
            --code-bg: #2d2d2d;
            --log-bg: #1e1e1e;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: var(--bg-color);
            color: var(--text-main);
            display: flex;
            padding: 20px;
            gap: 20px;
            min-height: 100vh;
        }

        @media (max-width: 1200px) {
            body { flex-direction: column; }
        }

        .container, .debug-panel {
            background: var(--panel-bg);
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
            padding: 30px;
            flex: 1;
            min-width: 350px;
        }

        h1 { font-size: 24px; margin-bottom: 20px; color: #1a1a1a; }

        .form-group { margin-bottom: 15px; }
        label { display: block; margin-bottom: 5px; font-weight: 600; font-size: 13px; color: var(--text-muted); }

        input[type="text"], input[type="email"], input[type="number"], textarea {
            width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 6px; font-size: 14px;
        }

        .config-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 10px; background: #f8f9fa;
            padding: 15px; border-radius: 8px; margin-bottom: 20px;
        }

        .checkbox-group { display: flex; align-items: center; gap: 8px; font-size: 13px; margin-top: 5px; }
        .captcha-container { margin: 20px 0; min-height: 80px; }

        button {
            background: var(--primary); color: white; border: none; padding: 12px; border-radius: 6px;
            font-weight: 600; cursor: pointer; transition: background 0.2s;
        }
        button:hover:not(:disabled) { background: var(--primary-hover); }
        button:disabled { opacity: 0.5; cursor: not-allowed; }

        .button-group { display: flex; gap: 10px; margin-top: 20px; }
        .button-group button { flex: 1; }
        .btn-success { background: var(--success); }
        .btn-warning { background: var(--warning); }
        .btn-secondary { background: var(--secondary); font-size: 11px; padding: 5px 10px; }

        .debug-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .debug-title { font-size: 12px; font-weight: bold; text-transform: uppercase; color: #888; margin-top: 15px; margin-bottom: 5px;}

        #log {
            width: 100%; height: 180px; background: var(--log-bg); color: #d4d4d4;
            padding: 10px; font-family: 'Courier New', monospace; font-size: 12px;
            border-radius: 6px; overflow-y: auto; resize: none; border: 1px solid #333;
        }

        .tabs { display: flex; gap: 5px; margin-bottom: 5px; overflow-x: auto; padding-bottom: 5px; }
        .tab {
            padding: 5px 10px; font-size: 11px; background: #e2e8f0; border: none;
            border-radius: 4px; cursor: pointer; color: var(--text-main); font-weight: 600; white-space: nowrap;
        }
        .tab.active { background: var(--primary); color: white; }
        .tab-content { display: none; }
        .tab-content.active { display: block; }

        .code-box {
            width: 100%; height: 350px; background: var(--code-bg); color: #9cdcfe;
            padding: 10px; font-family: monospace; font-size: 11px; border-radius: 6px;
            white-space: pre; overflow: auto; border: 1px solid #444;
        }

        .verification-data {
            background: var(--log-bg); padding: 10px; border-radius: 6px; font-family: monospace;
            font-size: 11px; height: 120px; overflow-y: auto; border: 1px solid #333; color: #ce9178;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>OpenALTCHA Demo</h1>

        <div class="config-grid">
            <div class="form-group">
                <label>Domain</label>
                <input type="text" id="cfg_domain" value="localhost">
            </div>
            <div class="form-group">
                <label>API Base URL</label>
                <input type="text" id="cfg_api" value="/">
            </div>
            <div class="checkbox-group" style="grid-column: span 2;">
                <input type="checkbox" id="cfg_sign" checked>
                <label for="cfg_sign">Enable Content Signing (SPAM protection)</label>
            </div>
            <div class="checkbox-group" style="grid-column: span 2;">
                <input type="checkbox" id="cfg_disable_autoreset" checked>
                <label for="cfg_disable_autoreset">Auto-reset on tamper (when signing enabled)</label>
            </div>
        </div>

        <form id="demoForm">
            <div class="form-group">
                <label for="name">Full Name</label>
                <input type="text" id="name" name="name" required placeholder="John Doe">
            </div>
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" id="email" name="email" required placeholder="john@example.com">
            </div>
            <div class="form-group">
                <label for="message">Message</label>
                <textarea id="message" name="message" required style="width: 100%; min-height: 60px;"></textarea>
            </div>

            <div class="captcha-container" id="widget-wrapper"></div>

            <div class="button-group">
                <button type="button" id="verifyBtn" disabled class="btn-success">Verify (Backend Simulation)</button>
                <button type="button" id="resetBtn" class="btn-warning">Reset</button>
            </div>
        </form>
    </div>

    <div class="debug-panel">
        <div class="form-group" style="margin-bottom: 15px;">
            <label>Rapid Challenge Requests</label>
            <div style="display: flex; gap: 10px; align-items: center;">
                <input type="number" id="rapid_requests" value="10" min="1" max="1000" style="width: 80px;">
                <button type="button" id="rapidBtn" style="flex: 1;">Make Rapid Requests</button>
            </div>
        </div>

        <div class="debug-header">
            <div class="debug-title">Execution Log</div>
            <button class="btn-secondary" onclick="clearLog()">Clear</button>
        </div>
        <textarea id="log" readonly></textarea>

        <div class="debug-title">Integration Code Examples</div>
        <div class="tabs" id="code-tabs">
            <button class="tab active" data-target="tab-html">Widget HTML & JS</button>
            <button class="tab" data-target="tab-vue">Widget Vue</button>
            <button class="tab" data-target="tab-formdata">API Form-Data</button>
            <button class="tab" data-target="tab-json">API JSON</button>
        </div>
        <div id="tab-html" class="tab-content active">
            <div id="code-preview-html" class="code-box"></div>
        </div>
        <div id="tab-vue" class="tab-content">
            <div id="code-preview-vue" class="code-box"></div>
        </div>
        <div id="tab-formdata" class="tab-content">
            <div id="code-preview-formdata" class="code-box"></div>
        </div>
        <div id="tab-json" class="tab-content">
            <div id="code-preview-json" class="code-box"></div>
        </div>

        <div class="debug-title">State: Verification Data</div>
        <div class="verification-data" id="verify-data-display">{}</div>
    </div>

    <script>
        // DOM Elements
        const DOM = {
            form: document.getElementById('demoForm'),
            logArea: document.getElementById('log'),
            codeBoxHtml: document.getElementById('code-preview-html'),
            codeBoxVue: document.getElementById('code-preview-vue'),
            codeBoxFormData: document.getElementById('code-preview-formdata'),
            codeBoxJson: document.getElementById('code-preview-json'),
            wrapper: document.getElementById('widget-wrapper'),
            verifyDataDisplay: document.getElementById('verify-data-display'),
            cfgDomain: document.getElementById('cfg_domain'),
            cfgApi: document.getElementById('cfg_api'),
            cfgSign: document.getElementById('cfg_sign'),
            cfgDisableAutoreset: document.getElementById('cfg_disable_autoreset'),
            verifyBtn: document.getElementById('verifyBtn'),
            resetBtn: document.getElementById('resetBtn'),
            rapidBtn: document.getElementById('rapidBtn'),
            rapidRequests: document.getElementById('rapid_requests'),
            inputs: document.querySelectorAll('#demoForm input[type="text"], #demoForm input[type="email"], #demoForm textarea')
        };

        // State
        const State = {
            currentPayload: null,
            validationResult: null,
            logLines: JSON.parse(sessionStorage.getItem('openaltcha_logs')) || [],
            originalFormDataSnapshot: null,
            clientIp: null
        };

        // Initialization
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('domain')) DOM.cfgDomain.value = urlParams.get('domain');
        if (urlParams.get('api')) DOM.cfgApi.value = urlParams.get('api');

        // Helpers
        const getApiUrl = () => {
            let api = DOM.cfgApi.value;
            if (!api.endsWith('/')) api += '/';
            if (!api.startsWith('http') && api !== '/') {
                api = location.origin + api;
            }
            return api;
        };

        const getFormData = () => ({
            name: document.getElementById('name').value,
            email: document.getElementById('email').value,
            message: document.getElementById('message').value
        });

        // Logging System
        function log(msg) {
            const time = new Date().toLocaleTimeString();
            State.logLines.push(`[${time}] ${msg}`);
            if (State.logLines.length > 50) State.logLines.shift();
            sessionStorage.setItem('openaltcha_logs', JSON.stringify(State.logLines));
            renderLogs();
        }

        function renderLogs() {
            DOM.logArea.value = State.logLines.join('\n');
            DOM.logArea.scrollTop = DOM.logArea.scrollHeight;
        }

        window.clearLog = () => {
            State.logLines = [];
            sessionStorage.removeItem('openaltcha_logs');
            renderLogs();
            log("[INFO] Log cleared.");
        };

        // Core Widget Logic
        function applyValidationResult(result, sourceLabel) {
            if (!result) return;
            State.validationResult = result;
            DOM.verifyDataDisplay.textContent = JSON.stringify(result, null, 2);

            if (result.verified) {
                log(`[OK] ${sourceLabel} passed.`);
                DOM.verifyBtn.disabled = false;
            } else {
                log(`[FAIL] ${sourceLabel}: ${result.reason || 'Invalid'}`);
                DOM.verifyBtn.disabled = true;
            }
        }

        function updateCodePreviews(challengeUrl, verifyUrl, spamFilter) {
            const spamAttr = spamFilter ? `\n        spamfilter="${spamFilter}"` : '';
            const resetLogic = (DOM.cfgSign.checked && DOM.cfgDisableAutoreset.checked)
                ? `\n    // Auto-reset on input tamper
    form.querySelectorAll('input, textarea').forEach(el => {
        el.addEventListener('input', () => {
            if (widget.getState() === 'verified') {
                widget.reset();
            }
        });
    });\n`
                : '';

            DOM.codeBoxHtml.textContent = `<script type="module" src="https://cdn.jsdelivr.net/npm/altcha/dist/altcha.min.js"><\/script>

<form id="demoForm">
    <label>Full Name</label>
    <input type="text" name="name" required placeholder="John Doe">

    <label>Email Address</label>
    <input type="email" name="email" required placeholder="john@example.com">

    <label>Message</label>
    <textarea name="message" required></textarea>

    <altcha-widget
        id="altcha"
        challengeurl="${challengeUrl}"
        verifyurl="${verifyUrl}"${spamAttr}
        hidefooter="true"
    ></altcha-widget>

    <button type="submit">Submit</button>
</form>

<script>
    const form = document.getElementById('demoForm');
    const widget = document.getElementById('altcha');
${resetLogic}
    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        if (widget.getState() !== 'verified') {
            alert('Please solve the CAPTCHA'); return;
        }

        const payload = await widget.getPayload();
        const formData = new FormData(form);
        formData.append('altchaPayload', payload);

        await fetch('/api/submit', { method: 'POST', body: formData });
    });
<\/script>`;

            DOM.codeBoxVue.textContent = `<script setup>
import 'altcha';
import { ref } from 'vue';

const widget = ref(null);

const onSubmit = async () => {
    if (widget.value.getState() !== 'verified') {
        alert('Please solve the CAPTCHA'); return;
    }

    const payload = await widget.value.getPayload();

    // Combine your form data and the payload
    const formData = new FormData();
    // ... append fields
    formData.append('altchaPayload', payload);

    await fetch('/api/submit', { method: 'POST', body: formData });
};
<\/script>

<template>
    <form @submit.prevent="onSubmit">
        <!-- Your inputs -->

        <altcha-widget
            ref="widget"
            challengeurl="${challengeUrl}"
            verifyurl="${verifyUrl}"${spamAttr}
        ></altcha-widget>

        <button type="submit">Submit</button>
    </form>
</template>`;

            DOM.codeBoxFormData.textContent = `const express = require('express');
const multer = require('multer'); // For parsing multipart/form-data
const app = express();
const upload = multer();

app.post('/api/submit', upload.none(), async (req, res) => {
    try {
        // If using verifyurl, the payload is already the server signature
        const altcha = JSON.parse(req.body.altchaPayload);

        // Validate the signature with the Sentinel server
        const verifyRes = await fetch('http://localhost:3000/captcha/validate?domain=localhost', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                verificationData: altcha.verificationData,
                signature: altcha.signature,
                time: altcha.time,
                ip: req.ip, // can be provided for additional security
            })
        });

        const data = await verifyRes.json();
        if (!data.valid) return res.status(400).send('Invalid CAPTCHA');

        // If Spam Filter (content signing) is enabled, use the verifed fields
        // instead of the raw req.body to prevent tampering
        const verificationData = JSON.parse(altcha.verificationData);
        const safeFields = verificationData.fields || {};

        console.log('Verified Fields:', safeFields);
        res.send('Success!');
    } catch (err) {
        res.status(500).send('Error verifying captcha');
    }
});`;

            DOM.codeBoxJson.textContent = `const express = require('express');
const app = express();

app.post('/api/submit', express.json(), async (req, res) => {
    try {
        // Assuming your frontend sends JSON including altchaPayload
        const altcha = req.body.altchaPayload;
        // e.g. { verificationData: "...", signature: "...", time: 123... }

        // Validate the signature with the Sentinel server
        const verifyRes = await fetch('http://localhost:3000/captcha/validate?domain=localhost', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({
                verificationData: altcha.verificationData,
                signature: altcha.signature,
                time: altcha.time,
                ip: req.ip, // can be provided for additional security
            })
        });

        const data = await verifyRes.json();
        if (!data.valid) return res.status(400).send('Invalid CAPTCHA');

        // Extract securely trusted form fields
        const verificationData = JSON.parse(altcha.verificationData);
        const safeFields = verificationData.fields || {};

        console.log('Verified Fields:', safeFields);
        res.send('Success!');
    } catch (err) {
        res.status(500).send('Error verifying captcha');
    }
});`;
        }

        function updateWidget() {
            const domain = DOM.cfgDomain.value || 'localhost';
            const api = getApiUrl();
            const challengeUrl = `${api}captcha/challenge?domain=${encodeURIComponent(domain)}`;
            const verifyUrl = `${api}captcha/verify?domain=${encodeURIComponent(domain)}`;
            const spamFilter = DOM.cfgSign.checked ? 'name,email,message' : '';

            // Reset UI state
            State.currentPayload = null;
            State.validationResult = null;
            State.originalFormDataSnapshot = null;
            DOM.verifyBtn.disabled = true;
            DOM.verifyDataDisplay.textContent = "{}";
            DOM.wrapper.innerHTML = '';

            // Create new widget
            const widget = document.createElement('altcha-widget');
            widget.setAttribute('challengeurl', challengeUrl);
            widget.setAttribute('verifyurl', verifyUrl);
            if (spamFilter) widget.setAttribute('spamfilter', spamFilter);
            widget.setAttribute('hidefooter', 'true');
            widget.id = 'altcha';

            DOM.wrapper.appendChild(widget);

            // Bind events
            widget.addEventListener('statechange', (ev) => {
                log(`[STATE] ${ev.detail.state.toUpperCase()}`);
                if (ev.detail.state === 'verified') {
                    State.currentPayload = ev.detail.payload || State.validationResult?.payload || State.currentPayload;
                    State.originalFormDataSnapshot = JSON.stringify(getFormData());
                    log('[DATA] Payload received.');
                }
            });

            widget.addEventListener('sentinelverification', (ev) => applyValidationResult(ev.detail, 'Auto-validate'));
            widget.addEventListener('serververification', (ev) => applyValidationResult(ev.detail, 'Auto-validate'));

            // Update dynamically generated code block
            updateCodePreviews(challengeUrl, verifyUrl, spamFilter);
        }

        // Event Listeners
        DOM.inputs.forEach(el => {
            el.addEventListener('input', () => {
                const widget = document.getElementById('altcha');
                if (DOM.cfgSign.checked && State.currentPayload && DOM.cfgDisableAutoreset.checked) {
                    log('[WARN] Form data tampered. Resetting widget.');
                    State.currentPayload = null;
                    State.validationResult = null;
                    DOM.verifyBtn.disabled = true;
                    if (widget) widget.reset();
                }
            });
        });

        DOM.verifyBtn.addEventListener('click', async () => {
            if (!State.validationResult) return;

            const currentData = getFormData();
            const isTampered = State.originalFormDataSnapshot && JSON.stringify(currentData) !== State.originalFormDataSnapshot;

            log('[WAIT] Calling /captcha/validate (Backend-to-Backend simulation)...');

            try {
                const api = getApiUrl();

                if (!State.clientIp) {
                    try {
                        const ipRes = await fetch(`${api}ip`);
                        const ipData = await ipRes.json();
                        State.clientIp = ipData.ip;
                        log(`[INFO] Fetched client IP: ${State.clientIp}`);
                    } catch (err) {
                        log(`[WARN] Failed to fetch IP: ${err.message}`);
                    }
                }

                let vDataToSend = State.validationResult.verificationData;

                // Simulate Tampering behavior
                if (DOM.cfgSign.checked && isTampered) {
                    log('[TAMPER] Data modified. Syncing verificationData. Expected to FAIL.');
                    try {
                        const decoded = vDataToSend.trim().startsWith('{')
                            ? JSON.parse(vDataToSend)
                            : JSON.parse(atob(vDataToSend));

                        decoded.fields = currentData;

                        vDataToSend = vDataToSend.trim().startsWith('{')
                            ? JSON.stringify(decoded)
                            : btoa(JSON.stringify(decoded));
                    } catch (e) {
                        log('[ERROR] Re-sync failed: ' + e.message);
                    }
                }

                const verifyPayload = {
                    domain: DOM.cfgDomain.value,
                    verificationData: vDataToSend,
                    signature: State.validationResult.signature,
                    time: State.validationResult.time
                };

                if (State.clientIp) verifyPayload.ip = State.clientIp;

                const res = await fetch(`${api}captcha/validate`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(verifyPayload)
                });

                const result = await res.json();
                if (result.valid) {
                    log('[SUCCESS] Backend Verification passed. Signature is authentic.');
                } else {
                    log('[FAIL] Backend Verification failed. ' + (result.reason || 'Invalid signature.'));
                }
            } catch (err) {
                log(`[ERROR] ${err.message}`);
            }
        });

        DOM.resetBtn.addEventListener('click', () => {
            log('[INFO] Resetting demo...');
            DOM.form.reset();
            updateWidget();
        });

        DOM.rapidBtn.addEventListener('click', async () => {
            const count = parseInt(DOM.rapidRequests.value) || 10;
            const domain = DOM.cfgDomain.value || 'localhost';
            const api = getApiUrl();
            const challengeUrl = `${api}captcha/challenge?domain=${encodeURIComponent(domain)}`;

            log(`[WAIT] Starting ${count} rapid requests...`);
            DOM.rapidBtn.disabled = true;

            for (let i = 1; i <= count; i++) {
                try {
                    await fetch(challengeUrl);
                    log(`[${i}/${count}] Challenge request completed`);
                } catch (err) {
                    log(`[${i}/${count}] Challenge request failed: ${err.message}`);
                }
            }

            log(`[OK] Completed ${count} rapid requests.`);
            DOM.rapidBtn.disabled = false;
        });

        // Bind Config Changes to Update Widget
        [DOM.cfgDomain, DOM.cfgApi, DOM.cfgSign, DOM.cfgDisableAutoreset].forEach(el => {
            el.addEventListener('change', updateWidget);
        });

        // Setup Tabs
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab, .tab-content').forEach(el => el.classList.remove('active'));
                tab.classList.add('active');
                document.getElementById(tab.dataset.target).classList.add('active');
            });
        });

        // Initial Load
        renderLogs();
        updateWidget();
        log('[INFO] OpenALTCHA Demo Ready.');
    </script>
</body>
</html>
